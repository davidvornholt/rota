name: Nix

# Builds the Nix package that other flakes consume as
# `packages.<system>.rota-cli`. It also runs on draft pull requests, so a stale
# dependency hash shows up before review. It's required because Standards
# auto-merge waits only for required checks and `check` doesn't build this
# package, so a Dependabot update would otherwise land with a stale hash.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Nix build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build
        run: nix build .#rota-cli -L

      - name: Check the binary and skills
        run: |
          set -euo pipefail
          result/bin/rota --help
          diff -r apps/cli/skills result/share/rota-cli/skills
