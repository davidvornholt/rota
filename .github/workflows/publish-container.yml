name: Publish container

# Merging to main releases to production. The image builds while Standards
# runs; the release starts only after Standards has passed on this exact
# commit, because a squash commit on main is new and the pull request's checks
# do not cover it. Rota has no pull request previews (recorded in
# personal-infra), so this workflow runs for main only.
on:
  push:
    branches:
      - main

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      gated-sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Require the standards gate for this exact commit
        id: gate
        env:
          GATE_JOB: check
          GATE_WORKFLOW: standards.yml
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$(($(date -u +%s) + 2400))
          while :; do
            run=$(gh api \
              "repos/$REPOSITORY/actions/workflows/$GATE_WORKFLOW/runs?head_sha=$SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] // empty')
            if [ -n "$run" ] && [ "$(jq -er .status <<<"$run")" = completed ]; then
              break
            fi
            if [ "$(date -u +%s)" -ge "$deadline" ]; then
              echo "::error::The $GATE_WORKFLOW gate did not complete for $SHA within the deadline"
              exit 1
            fi
            sleep 20
          done

          test "$(jq -er .head_sha <<<"$run")" = "$SHA"
          conclusion=$(jq -er .conclusion <<<"$run")
          if [ "$conclusion" != success ]; then
            echo "::error::The $GATE_WORKFLOW gate concluded $conclusion for $SHA"
            exit 1
          fi

          run_id=$(jq -er .id <<<"$run")
          job=$(gh api --paginate "repos/$REPOSITORY/actions/runs/$run_id/jobs" \
            --jq ".jobs[] | select(.name == \"$GATE_JOB\") | .conclusion")
          if [ "$job" != success ]; then
            echo "::error::The $GATE_JOB job of run $run_id concluded ${job:-nothing} for $SHA"
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  # Runs in parallel with the gate. The pushed image is inert until the
  # release job, which needs the gate, hands its digest to the host.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # The registry cache exporter needs a BuildKit container builder.
      - uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The default Git context builds exactly github.sha. Cached layers keep
      # their digests while their inputs are unchanged, so prod-1 pulls only
      # the layers a commit changed. The cache lives in the registry under the
      # buildcache tag, outside the shared Actions cache quota; nothing
      # deploys that tag.
      - name: Build and push the commit image
        id: build
        uses: docker/build-push-action@v7
        with:
          push: true
          provenance: false
          tags: ghcr.io/davidvornholt/rota:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=ghcr.io/davidvornholt/rota:buildcache
          cache-to: type=registry,ref=ghcr.io/davidvornholt/rota:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  release:
    needs: [gate, build]
    if: needs.gate.outputs.gated-sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    concurrency:
      group: app-release-rota
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Release the image to production
        id: release
        uses: ./.github/actions/app-release
        with:
          unit: rota
          host: prod-1.vornholt.online
          known-host: prod-1.vornholt.online ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFkom7Y24gnBa9X+gUDBZvlCnXiuKTo87ROOtlMpgNH5
          images: rota@${{ needs.build.outputs.digest }}
          age-key: ${{ secrets.SOPS_AGE_KEY }}

      # A superseded release leaves the newer release's tag in place.
      - name: Log in to the GitHub Container Registry
        if: steps.release.outputs.result == 'released' || steps.release.outputs.result == 'unchanged'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Point the main tag at the released image
        if: steps.release.outputs.result == 'released' || steps.release.outputs.result == 'unchanged'
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          IMAGE: ghcr.io/davidvornholt/rota
        run: |
          set -euo pipefail
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:main" "$IMAGE@$DIGEST"
          resolved=$(docker buildx imagetools inspect "$IMAGE:main" --format '{{json .Manifest}}' | jq -er .digest)
          test "$resolved" = "$DIGEST"
