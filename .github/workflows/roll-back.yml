name: Roll back

# Switches production back to the release before the current one. Running it
# again returns to the newer release, because the host swaps current and
# previous. It shares the release queue, so it never overlaps a release.
on:
  workflow_dispatch:

permissions: {}

jobs:
  roll-back:
    if: github.repository == 'davidvornholt/rota' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    concurrency:
      group: app-release-rota
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Roll production back to the previous release
        uses: ./.github/actions/app-release
        with:
          command: rollback
          unit: rota
          host: prod-1.vornholt.online
          known-host: prod-1.vornholt.online ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFkom7Y24gnBa9X+gUDBZvlCnXiuKTo87ROOtlMpgNH5
          age-key: ${{ secrets.SOPS_AGE_KEY }}
