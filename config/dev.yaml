# Shared non-secret development configuration, keyed like secrets/dev.yaml
# (apps.<name>, packages.<name>). `just dev-env-generate` composes each
# workspace's .env.local from the three dev layers and any authorized
# broker-owned S3 pairs referenced by a plain layer. The local layer overrides
# the shared layers. A key never lives in both this file and secrets/dev.yaml.
# This file is seeded once and then owned by your repo.
#
# GITHUB_CLIENT_ID is the "Postlude (dev)" GitHub OAuth app, whose callback is
# http://localhost:3000/api/auth/callback/github — the same path Rota uses, so
# the two apps share it in development as long as both stay on port 3000. Its
# client secret is a secret and lives in secrets/dev.yaml.
apps:
  web:
    DATABASE_URL: &databaseUrl postgresql://rota:rota@127.0.0.1:15434/rota_dev
    BETTER_AUTH_URL: http://localhost:3000
    GITHUB_CLIENT_ID: Ov23liMZSmT9ereDMgRP
    GITHUB_ALLOWED_ACCOUNT_ID: "157214705"
    # Gemini runs through Vertex AI with a service account (the JSON is a
    # secret); the global location avoids regional availability gaps.
    GEMINI_MODEL: gemini-3.8-flash
    GOOGLE_VERTEX_PROJECT: project-6fcd7666-a4cc-44a1-be1
    GOOGLE_VERTEX_LOCATION: global
    # Studio renders come from GPT-Image-2 deployed in Microsoft Foundry. The
    # endpoint is the resource root; the app appends the v1 images path.
    FOUNDRY_OPENAI_ENDPOINT: https://prosabridge-resource.openai.azure.com
    FOUNDRY_IMAGE_DEPLOYMENT: gpt-image-2
    # Development keeps images on disk. Production sets MEDIA_STORE=s3 with the
    # S3_* values and a MEDIA_PUBLIC_BASE_URL for the bucket's custom domain.
    MEDIA_STORE: local
    MEDIA_LOCAL_DIR: .media
packages:
  db:
    # The app and the migration tooling share one local database.
    DATABASE_URL: *databaseUrl
