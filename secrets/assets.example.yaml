# Required only for `bun standards screenshots publish`; no defaults.
# The broker owns this repository's bucket-scoped S3 write pair and its rotation.
# Both keys must exist together. Builds, tests, and deployments do not read them.
assets:
  screenshots_rw:
    access_key_id: replace-with-r2-access-key-id
    secret_access_key: replace-with-r2-secret-access-key
