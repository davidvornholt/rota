# Plaintext shape only. Do not put real development secrets in this file.
# Mirror this shape in the encrypted secrets/dev.yaml (SOPS + age). Each
# workspace documents the values it consumes in its own README, and
# `just dev-env-generate` composes each workspace's .env.local from the three
# dev layers and any authorized broker-owned S3 pairs referenced by a plain
# layer. Keep non-secret values in config/dev.yaml — a key never lives in both
# tracked layers. This file is seeded once and then owned by your repo — extend
# it to match your real secrets; sync will not overwrite it.
apps:
  web:
    # Required. Signs better-auth sessions; at least 32 characters.
    BETTER_AUTH_SECRET: replace-with-a-long-random-dev-secret
    # Required. Client secret of the GitHub OAuth app named by GITHUB_CLIENT_ID.
    GITHUB_CLIENT_SECRET: replace-with-the-dev-github-oauth-app-secret
    # Required. API key of the Microsoft Foundry resource in FOUNDRY_OPENAI_ENDPOINT.
    FOUNDRY_OPENAI_API_KEY: replace-with-the-foundry-api-key
    # Required. Service-account JSON (one line) with Vertex AI User on GOOGLE_VERTEX_PROJECT.
    GOOGLE_VERTEX_CREDENTIALS_JSON: '{"type":"service_account","project_id":"replace"}'
